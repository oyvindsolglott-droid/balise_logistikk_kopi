name: Update static balise data

on:
  workflow_dispatch:
  schedule:
    # Bruk eksplisitt Oslo-tid slik at sommer-/vintertid handteres av GitHub.
    # En lett kontroll kl. :17 hver time er sikkerhetsnett ved forsinkede eller
    # droppede schedule-events. Tunge steg styres fortsatt av kontrollen under.
    - cron: "17 * * * *"
      timezone: "Europe/Oslo"

    # Kritiske Oslo-vinduer: forste forsok syv minutter etter timeskiftet,
    # deretter kontrollerte retry-forsok gjennom samme time.
    - cron: "7,22,37,52 4,7,15,21 * * *"
      timezone: "Europe/Oslo"

permissions:
  contents: write
  actions: read

concurrency:
  group: update-static-balise-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check local Oslo time
        id: oslo-time
        run: |
          HOUR="$(TZ=Europe/Oslo date +%H)"
          DATE="$(TZ=Europe/Oslo date +%Y-%m-%d)"
          TIME="$(TZ=Europe/Oslo date +%H:%M:%S)"

          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "time=$TIME" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Determine whether update is needed
        id: update-check
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          now = datetime.now(ZoneInfo("Europe/Oslo"))
          today = now.date()

          cycle_candidates = []
          for day_offset in (-1, 0):
              candidate_date = today + timedelta(days=day_offset)
              for cycle_hour in (4, 7, 15, 21):
                  candidate = datetime.combine(
                      candidate_date,
                      datetime.min.time(),
                      tzinfo=ZoneInfo("Europe/Oslo"),
                  ).replace(hour=cycle_hour)
                  if candidate <= now:
                      cycle_candidates.append(candidate)
          intended_cycle = max(cycle_candidates)

          if now.hour < 7:
              expected_today = today - timedelta(days=1)
              expected_tomorrow = today
              window = "night_before_07"
          elif now.hour < 15:
              expected_today = today
              expected_tomorrow = today
              window = "day_07_to_15"
          else:
              expected_today = today
              expected_tomorrow = today + timedelta(days=1)
              window = "after_15"

          def read_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return {}

          idag = read_json("data/api_idag.json")
          imorgen = read_json("data/api_imorgen.json")

          idag_date = str(idag.get("date") or "")
          imorgen_date = str(imorgen.get("date") or "")
          expected_idag = expected_today.isoformat()
          expected_imorgen = expected_tomorrow.isoformat()

          dates_are_stale = idag_date != expected_idag or imorgen_date != expected_imorgen

          imorgen_departure_count = len(imorgen.get("departures") or {})
          imorgen_vehicle_count = len(imorgen.get("vehicles") or {})
          imorgen_departure_vehicle_count = len(imorgen.get("departureVehicles") or {})
          imorgen_missing_published_vehicles = (
              window == "after_15"
              and imorgen_date == expected_imorgen
              and imorgen_departure_count > 0
              and imorgen_vehicle_count == 0
              and imorgen_departure_vehicle_count == 0
          )

          operational_hour = f"{now.hour:02d}" in {"04", "07", "15", "21"}

          updated_values = [
              str(idag.get("updatedAt") or ""),
              str(imorgen.get("updatedAt") or ""),
          ]
          current_date_prefix = now.strftime("%d.%m.%Y")
          current_hour_prefix = now.strftime("%H:")

          already_updated_this_hour = all(
              value.startswith(current_date_prefix) and current_hour_prefix in value
              for value in updated_values
          )

          should_run = (
              event_name == "workflow_dispatch"
              or dates_are_stale
              or imorgen_missing_published_vehicles
              or (operational_hour and not already_updated_this_hour)
          )

          reason_parts = []
          if event_name == "workflow_dispatch":
              reason_parts.append("manual")
          if dates_are_stale:
              reason_parts.append(
                  f"stale_dates api_idag={idag_date}/expected={expected_idag} "
                  f"api_imorgen={imorgen_date}/expected={expected_imorgen}"
              )
          if imorgen_missing_published_vehicles:
              reason_parts.append(
                  "api_imorgen_missing_vehicles_after_15 "
                  f"departures={imorgen_departure_count} "
                  f"vehicles={imorgen_vehicle_count} "
                  f"departureVehicles={imorgen_departure_vehicle_count}"
              )
          if operational_hour and not already_updated_this_hour:
              reason_parts.append(f"operational_hour_{now.hour:02d}_not_updated_this_hour")
          if not reason_parts:
              reason_parts.append("up_to_date")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_run={'true' if should_run else 'false'}\n")
              out.write(f"window={window}\n")
              out.write(f"expected_idag={expected_idag}\n")
              out.write(f"expected_imorgen={expected_imorgen}\n")
              out.write(f"actual_idag={idag_date}\n")
              out.write(f"actual_imorgen={imorgen_date}\n")
              out.write(f"reason={' | '.join(reason_parts)}\n")
              out.write(f"intended_cycle_date={intended_cycle.date().isoformat()}\n")
              out.write(f"intended_cycle_hour={intended_cycle.strftime('%H')}\n")
              out.write(f"actual_workflow_start={now.isoformat(timespec='seconds')}\n")

          print("Oslo time:", now.strftime("%Y-%m-%d %H:%M:%S"))
          print("Window:", window)
          print("Expected:", expected_idag, expected_imorgen)
          print("Actual:", idag_date, imorgen_date)
          print("Already updated this hour:", already_updated_this_hour)
          print("Should run:", should_run)
          print("Reason:", " | ".join(reason_parts))
          PY

      - name: Stop summary
        if: steps.update-check.outputs.should_run != 'true'
        run: |
          echo "Ingen Balise-oppdatering nødvendig."
          echo "Oslo-tid: ${{ steps.oslo-time.outputs.time }}"
          echo "Vindu: ${{ steps.update-check.outputs.window }}"
          echo "Årsak: ${{ steps.update-check.outputs.reason }}"
          echo "api_idag: ${{ steps.update-check.outputs.actual_idag }} / forventet ${{ steps.update-check.outputs.expected_idag }}"
          echo "api_imorgen: ${{ steps.update-check.outputs.actual_imorgen }} / forventet ${{ steps.update-check.outputs.expected_imorgen }}"

      - name: Record intended cycle and execution decision
        if: always()
        run: |
          {
            echo "## Static Balise data cycle"
            echo "- Intended cycle: ${{ steps.update-check.outputs.intended_cycle_date }}T${{ steps.update-check.outputs.intended_cycle_hour }}:00 Europe/Oslo"
            echo "- Actual workflow start: ${{ steps.update-check.outputs.actual_workflow_start }}"
            echo "- Generator selected: ${{ steps.update-check.outputs.should_run }}"
            echo "- Decision reason: ${{ steps.update-check.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.update-check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.update-check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate static JSON files
        if: steps.update-check.outputs.should_run == 'true'
        env:
          SDE_INTENDED_CYCLE_DATE: ${{ steps.update-check.outputs.intended_cycle_date }}
          SDE_INTENDED_CYCLE_HOUR: ${{ steps.update-check.outputs.intended_cycle_hour }}
          SDE_ACTUAL_WORKFLOW_START: ${{ steps.update-check.outputs.actual_workflow_start }}
        run: python update_static_data.py

      - name: Show generated dates
        if: steps.update-check.outputs.should_run == 'true'
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path

          for f in ["data/api_idag.json", "data/api_imorgen.json", "data/sde-data-provenance.json"]:
              data = json.loads(Path(f).read_text(encoding="utf-8"))
              print(f"{f}: date={data.get('date')} updatedAt={data.get('updatedAt')} generationId={data.get('generationId')} vehicles={len(data.get('vehicles', {}) or {})}")
          PY2

      - name: Commit and push updated data
        id: data-push
        if: steps.update-check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_idag.json data/api_imorgen.json data/sde-data-provenance.json

          staged_files="$(git diff --cached --name-only)"
          unexpected_files="$(printf '%s\n' "$staged_files" | grep -vE '^data/(api_(idag|imorgen)\.json|sde-data-provenance\.json)$' || true)"
          if [ -n "$unexpected_files" ]; then
            echo "Uventede filer er staged:"
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Ingen dataendring; ingen commit eller push."
            exit 0
          fi

          git commit -m "Oppdater statiske balise-data"

          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Create non-circular data release attestation
        if: steps.data-push.outputs.commit != ''
        run: >-
          python sde_data_release_attestation.py
          --manifest data/sde-data-provenance.json
          --commit "${{ steps.data-push.outputs.commit }}"
          --tree "${{ steps.data-push.outputs.tree }}"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --workflow-context-sha "${{ github.sha }}"
          --output "$RUNNER_TEMP/sde-data-release-attestation.json"

      - name: Upload data release attestation
        if: steps.data-push.outputs.commit != ''
        uses: actions/upload-artifact@v4
        with:
          name: sde-data-release-attestation-${{ steps.data-push.outputs.commit }}
          path: ${{ runner.temp }}/sde-data-release-attestation.json
          if-no-files-found: error
          retention-days: 30
