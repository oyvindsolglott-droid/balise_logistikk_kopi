name: Update static balise data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions bruker UTC.
    # Norge er UTC+1 vintertid og UTC+2 sommertid.
    # Derfor kjører vi både 02:00 og 03:00 UTC,
    # men stopper jobben hvis lokal Oslo-tid ikke er 04.
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check local Oslo time
        id: oslo-time
        run: |
          echo "hour=$(TZ=Europe/Oslo date +%H)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Oslo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "time=$(TZ=Europe/Oslo date +%H:%M:%S)" >> "$GITHUB_OUTPUT"

      - name: Stop if not 04 Oslo time
        if: github.event_name == 'schedule' && steps.oslo-time.outputs.hour != '04'
        run: |
          echo "Stopper: lokal Oslo-tid er ${{ steps.oslo-time.outputs.time }}, ikke 04."
          exit 0

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate static JSON files
        run: python update_static_data.py

      - name: Show generated dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for f in ["data/api_idag.json", "data/api_imorgen.json"]:
              data = json.loads(Path(f).read_text(encoding="utf-8"))
              print(f"{f}: date={data.get('date')} updatedAt={data.get('updatedAt')} vehicles={len(data.get('vehicles', {}) or {})}")
          PY

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_idag.json data/api_imorgen.json
          git diff --cached --quiet || git commit -m "Oppdater statiske balise-data"
          git push
