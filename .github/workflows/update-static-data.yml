name: Update static balise data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions bruker UTC.
    # Norge er UTC+1 vintertid og UTC+2 sommertid.
    #
    # Vi ønsker oppdatering når lokal Oslo-tid er:
    # 04:00 - natt/morgenoppdatering
    # 07:00 - dagvindu, ankomst og avgang samme dato
    # 15:00 - avgang skifter til neste driftsdøgn
    #
    # Derfor kjører vi på begge mulige UTC-timer og stopper jobben
    # hvis faktisk Oslo-time ikke er 04, 07 eller 15.
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "5 5 * * *"
    - cron: "5 6 * * *"
    - cron: "5 13 * * *"
    - cron: "5 14 * * *"

permissions:
  contents: write

concurrency:
  group: update-static-balise-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check local Oslo time
        id: oslo-time
        run: |
          echo "hour=$(TZ=Europe/Oslo date +%H)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Oslo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "time=$(TZ=Europe/Oslo date +%H:%M:%S)" >> "$GITHUB_OUTPUT"

      - name: Stop if not an operational update hour
        if: github.event_name == 'schedule' && !contains(fromJson('["04","07","15"]'), steps.oslo-time.outputs.hour)
        run: |
          echo "Stopper: lokal Oslo-tid er ${{ steps.oslo-time.outputs.time }}, ikke 04, 07 eller 15."
          exit 0

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate static JSON files
        run: python update_static_data.py

      - name: Show generated dates
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path

          for f in ["data/api_idag.json", "data/api_imorgen.json"]:
              data = json.loads(Path(f).read_text(encoding="utf-8"))
              print(f"{f}: date={data.get('date')} updatedAt={data.get('updatedAt')} vehicles={len(data.get('vehicles', {}) or {})}")
          PY2

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_idag.json data/api_imorgen.json
          git diff --cached --quiet || git commit -m "Oppdater statiske balise-data"
          git push
