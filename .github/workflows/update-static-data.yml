name: Update static balise data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions bruker UTC.
    # Norge er UTC+1 vintertid og UTC+2 sommertid.
    #
    # Vi ønsker oppdatering når lokal Oslo-tid er:
    # 04:00 - natt/morgenoppdatering
    # 07:00 - dagvindu, ankomst og avgang samme dato
    # 15:00 - avgang skifter til neste driftsdøgn
    #
    # Derfor kjører vi på begge mulige UTC-timer og lar jobben
    # selv avgjøre om faktisk Oslo-time er 04, 07 eller 15.
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "5 5 * * *"
    - cron: "5 6 * * *"
    - cron: "5 13 * * *"
    - cron: "5 14 * * *"

permissions:
  contents: write

concurrency:
  group: update-static-balise-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check local Oslo time
        id: oslo-time
        run: |
          HOUR="$(TZ=Europe/Oslo date +%H)"
          DATE="$(TZ=Europe/Oslo date +%Y-%m-%d)"
          TIME="$(TZ=Europe/Oslo date +%H:%M:%S)"

          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "time=$TIME" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manuell kjøring: oppdaterer uansett lokal Oslo-tid $TIME."
          elif [ "$HOUR" = "04" ] || [ "$HOUR" = "07" ] || [ "$HOUR" = "15" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Planlagt kjøring: lokal Oslo-tid er $TIME. Oppdaterer."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Planlagt kjøring hoppes over: lokal Oslo-tid er $TIME, ikke 04, 07 eller 15."
          fi

      - name: Stop summary
        if: steps.oslo-time.outputs.should_run != 'true'
        run: |
          echo "Ingen oppdatering nødvendig ved Oslo-tid ${{ steps.oslo-time.outputs.time }}."

      - name: Check out repository
        if: steps.oslo-time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.oslo-time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.oslo-time.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate static JSON files
        if: steps.oslo-time.outputs.should_run == 'true'
        run: python update_static_data.py

      - name: Show generated dates
        if: steps.oslo-time.outputs.should_run == 'true'
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path

          for f in ["data/api_idag.json", "data/api_imorgen.json"]:
              data = json.loads(Path(f).read_text(encoding="utf-8"))
              print(f"{f}: date={data.get('date')} updatedAt={data.get('updatedAt')} vehicles={len(data.get('vehicles', {}) or {})}")
          PY2

      - name: Commit and push updated data
        if: steps.oslo-time.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_idag.json data/api_imorgen.json
          git diff --cached --quiet || git commit -m "Oppdater statiske balise-data"
          git push
