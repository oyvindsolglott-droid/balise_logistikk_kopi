name: SDE permanent regression firewall

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sde-regression-firewall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permanent-regressions:
    name: permanent-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full regression history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test imports
        run: python -m pip install -r requirements.txt

      - name: Run mandatory SDE regression firewall
        run: npm test
