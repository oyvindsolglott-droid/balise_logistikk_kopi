name: SDE permanent regression firewall

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sde-regression-firewall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browserguard:
    name: browserguard-python311-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Browserguard source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Browserguard Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Browserguard appserver dependencies
        run: npm ci --prefix server

      - name: Set up exact Browserguard Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install locked Browserguard packages
        run: >-
          python -m pip install --require-hashes
          -r tests/sde-quality-engine/browserguard/requirements.lock

      - name: Install matching Browserguard Chromium and WebKit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sde-qe-browserguard-browsers
        run: python -m playwright install --with-deps chromium webkit

      - name: Verify Browserguard runtime contract
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sde-qe-browserguard-browsers
        run: python -B tests/sde-quality-engine/browserguard/runtime_contract.py

      - name: Run Browserguard security and broker gates
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sde-qe-browserguard-browsers
        run: xvfb-run -a python -B -m unittest discover -s tests/sde-quality-engine/browserguard -p 'test_*.py' -v

      - name: Run SDE menu layout and access browser regression
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sde-qe-browserguard-browsers
        run: xvfb-run -a npm run test:sde:menu-browser

      - name: Run actual empty-target relief drag browser regression
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sde-qe-browserguard-browsers
        run: xvfb-run -a npm run test:sde:empty-target-browser

      - name: Run chain-liveness candidate-continuation browser regression
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sde-qe-browserguard-browsers
        run: xvfb-run -a npm run test:sde:chain-liveness-browser

      - name: Run local handwriting recognition and private-save browser regressions
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sde-qe-browserguard-browsers
        run: xvfb-run -a npm run test:sde:htr-browser

      - name: Run critical SDE user-flow black-box gate
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sde-qe-browserguard-browsers
          SDE_QE_PYTHON: python
        run: xvfb-run -a npm run test:sde:qe:critical-user-flow

  permanent-regressions:
    name: permanent-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full regression history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test imports
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r server/togplassering_scanner_v03/requirements.txt

      - name: Install server contract dependencies
        run: npm ci --prefix server

      - name: Run mandatory SDE regression firewall
        id: permanent_regression
        run: npm run test:sde:strict

      - name: Run permanent handwriting model quality gate
        run: npm run test:sde:htr-quality

      - name: Run Tursatt post-arrival shift-card gate
        run: npm run test:sde:tursatt-post-arrival

      - name: Run SDE Quality Engine contracts and data parity
        id: quality_engine
        if: always()
        shell: bash
        run: |
          set +e
          npm run test:sde:qe:ci
          runner_exit=$?
          set -e
          echo "exit_code=${runner_exit}" >> "$GITHUB_OUTPUT"

      - name: Validate SDE Quality Engine CI semantics
        id: quality_engine_policy
        if: always()
        run: >-
          node tests/sde-quality-engine/ci-policy.cjs
          --report tests/sde-quality-engine/reports/latest.json
          --runner-exit "${{ steps.quality_engine.outputs.exit_code }}"
          --expected-commit "${{ github.sha }}"
          --upstream-qualification "${{ steps.permanent_regression.outcome }}"

      - name: Publish SDE Quality Engine summary
        if: always()
        shell: bash
        run: |
          if [ -f tests/sde-quality-engine/reports/latest.github-summary.md ]; then
            cat tests/sde-quality-engine/reports/latest.github-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## SDE Quality Engine' 'Report summary was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SDE Quality Engine reports
        id: quality_engine_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sde-quality-engine-reports-${{ github.sha }}-${{ github.run_id }}
          path: tests/sde-quality-engine/reports/
          if-no-files-found: error
          retention-days: 14
